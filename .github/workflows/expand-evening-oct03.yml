name: Expand October 3 evening articles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand queued articles
        run: python scripts/expand_evening_oct03.py
      - name: Commit expanded copy
        run: |
          git config user.name "provkus-scheduler"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scheduled-posts.json
          if git diff --cached --quiet; then
            echo "No queue changes"
          else
            git commit -m "Expand October 3 evening articles"
            git push
          fi
