name: Publish scheduled materials

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/scheduled-posts.json'
      - '.github/workflows/publish-scheduled.yml'
      - 'scripts/publish-scheduled.js'
      - 'scripts/build-feed.js'
      - 'scripts/add_dzen_footer.py'
      - 'scripts/import_scheduled_images.py'
      - 'scripts/editorial_source_guard.py'
      - 'scripts/start-site-with-scheduler.sh'
      - 'scripts/sync-runtime-queue.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provkus-scheduled-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enforce Russian-only editorial sources and wording
        run: python3 scripts/editorial_source_guard.py
      - name: Import scheduled source images
        run: python3 scripts/import_scheduled_images.py
      - name: Publish or withhold scheduled materials
        run: node scripts/publish-scheduled.js
      - name: Ensure static Dzen footer button
        run: python3 scripts/add_dzen_footer.py
      - name: Rebuild RSS feed for Dzen and readers
        run: node scripts/build-feed.js
      - name: Detect publication changes
        id: publication_changes
        shell: bash
        run: |
          if git diff --quiet -- .github/scheduled-posts.json data/posts.json articles/ assets/uploads/ feed.xml '*.html'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No publication changes; skip generated-site rebuild"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Publication changes detected"
          fi
      - name: Install image dependencies
        if: steps.publication_changes.outputs.changed == 'true'
        run: python3 -m pip install --quiet pillow
      - name: Refresh crawlable pages and indexes
        if: steps.publication_changes.outputs.changed == 'true'
        run: python3 scripts/seo_hardening.py
      - name: Generate responsive homepage images and quality surfaces
        if: steps.publication_changes.outputs.changed == 'true'
        run: |
          python3 scripts/optimize_home_images.py
          python3 scripts/build_indexes.py
          python3 scripts/build_discovery_archives.py
          python3 scripts/enhance_article_links.py
          python3 scripts/build_calculators_integration.py
          python3 scripts/optimize_home_markup.py
          python3 scripts/quality_sync.py
          python3 scripts/post_quality_hardening.py
          python3 scripts/check_indexing_surfaces.py
          python3 scripts/add_dzen_footer.py
          node --check assets/app.js
          node --check assets/community.js
      - name: Commit scheduler changes
        if: steps.publication_changes.outputs.changed == 'true'
        run: |
          if git diff --quiet; then
            echo "Nothing to publish or withhold"
            exit 0
          fi
          git config user.name "provkus-scheduler"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sync scheduled materials"
          git pull --rebase origin main
          git push origin HEAD:main

