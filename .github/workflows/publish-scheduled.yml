name: Publish scheduled materials

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/scheduled-posts.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provkus-scheduled-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish or withhold scheduled materials
        run: node scripts/publish-scheduled.js
      - name: Refresh crawlable pages and indexes
        run: python3 scripts/seo_hardening.py
      - name: Commit scheduler changes
        run: |
          if git diff --quiet; then
            echo "Nothing to publish or withhold"
            exit 0
          fi
          git config user.name "provkus-scheduler"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scheduled-posts.json data/posts.json articles/ index.html category.html recipes.html products.html home-storage.html food-safety.html sitemap.xml feed.xml
          git commit -m "Sync scheduled materials"
          git push origin HEAD:main
