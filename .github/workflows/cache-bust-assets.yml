name: Refresh public asset cache
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'scripts/bump_asset_versions.py'
      - '.github/workflows/cache-bust-assets.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh versions everywhere
        env:
          CACHE_VERSION: ${{ github.sha }}
        run: python3 scripts/bump_asset_versions.py
      - name: Rebuild public CSS
        run: python3 scripts/build_public_css.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/seasonal.js
      - name: Validate site
        run: |
          pip install pillow
          python3 scripts/audit_site.py
      - name: Commit refreshed asset URLs
        run: |
          if git diff --quiet; then
            echo "No cache refresh needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Refresh public asset cache versions"
          git push
