name: CMS photo source patch
on:
  push:
    branches: [main]
    paths:
      - 'scripts/admin_photo_source_patch.py'
      - '.github/workflows/admin-photo-source-patch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply CMS and visual patch
        run: python3 scripts/admin_photo_source_patch.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/admin.js
          node --check assets/admin-v3.js
      - name: Commit changes
        run: |
          git config user.name "provkus-cms-bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html assets/admin.js assets/admin-v3.js assets/overrides.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add manual photo source and unify cards"
          git push
