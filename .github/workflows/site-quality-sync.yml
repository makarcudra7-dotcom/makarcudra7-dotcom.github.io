name: Site quality sync
on:
  push:
    branches: [main]
    paths:
      - 'data/posts.json'
      - 'data/authors.json'
      - 'data/newsletter-pushes.json'
      - 'scripts/seo_hardening.py'
      - 'scripts/publish-scheduled.js'
      - 'scripts/quality_sync.py'
      - 'scripts/post_quality_hardening.py'
      - 'scripts/optimize_home_images.py'
      - 'scripts/optimize_home_markup.py'
      - 'scripts/build_indexes.py'
      - 'scripts/build-feed.js'
      - 'scripts/build-dzen-feed.py'
      - 'scripts/build_discovery_archives.py'
      - 'scripts/enhance_article_links.py'
      - 'scripts/build_calculators_integration.py'
      - 'scripts/check_indexing_surfaces.py'
      - '.github/workflows/site-quality-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: provkus-site-quality-sync
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image dependency
        run: python3 -m pip install --quiet pillow
      - name: Validate generators
        run: python3 -m py_compile scripts/quality_sync.py scripts/post_quality_hardening.py scripts/optimize_home_markup.py scripts/build_indexes.py scripts/build-dzen-feed.py scripts/build_discovery_archives.py scripts/enhance_article_links.py scripts/build_calculators_integration.py scripts/check_indexing_surfaces.py
      - name: Rebuild canonical public surfaces
        run: |
          python3 scripts/optimize_home_images.py
          python3 scripts/seo_hardening.py
          python3 scripts/build_indexes.py
          python3 scripts/build_discovery_archives.py
          python3 scripts/enhance_article_links.py
          python3 scripts/build_calculators_integration.py
          python3 scripts/optimize_home_markup.py
          python3 scripts/quality_sync.py
          python3 scripts/post_quality_hardening.py
      - name: Keep audit aligned with bundled critical CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/audit_site.py')
          source=path.read_text('utf-8')
          old="check('site-ui.css' in home,'index: critical styles in head')"
          new="check(('site-ui.css' in home or 'home-bundle.css' in home),'index: critical styles in head')"
          if old in source:
            source=source.replace(old,new,1)
          elif new not in source:
            raise SystemExit('critical stylesheet audit signature changed')
          path.write_text(source,'utf-8')
          PY
      - name: Validate runtime and SEO invariants
        run: |
          node --check assets/app.js
          node --check assets/community.js
          python3 scripts/post_quality_hardening.py
          python3 scripts/audit_site.py
          python3 scripts/check_indexing_surfaces.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          index=Path('index.html').read_text('utf-8')
          authors=Path('authors.html').read_text('utf-8')
          public=Path('assets/public.css').read_text('utf-8')
          community=Path('assets/community.js').read_text('utf-8')
          assert 'id="pv-hero-preload"' not in index
          assert '<!-- HOME-AUTHORS-START -->' in index
          assert 'id="pv-authors-schema"' in authors
          assert 'authors-fix.js' not in authors
          assert '@import' not in public
          assert "card.innerHTML=`<div class=\"author-card-top\"" not in community
          tea=Path('articles/vybirayu-chay-po-4-priznakam-vot-na-chto-obratit-vnimanie-1-layfhak-s-molokom-i-domashnie-posidelki-prevraschayutsya-v-chaynuyu-ceremoniyu.html').read_text('utf-8')
          assert not re.search(r'<img[^>]*alt=""', tea)
          print('site quality invariants ok')
          PY
      - name: Commit quality sync
        run: |
          git config user.name "provkus-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/audit_site.py scripts/quality_sync.py scripts/post_quality_hardening.py scripts/optimize_home_markup.py assets/public.css assets/site-ui.css assets/home-bundle.css assets/app.js assets/community.js '*.html' articles/ archive/ sitemap.xml feed.xml dzen.xml assets/uploads
          if git diff --cached --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git commit -m "Stabilize frontend, authors and SEO"
          git pull --rebase origin main
          git push origin HEAD:main
