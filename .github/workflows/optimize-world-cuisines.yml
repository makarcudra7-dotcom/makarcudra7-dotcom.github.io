name: Optimize world cuisines loading

on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_world_cuisines.py'
      - '.github/workflows/optimize-world-cuisines.yml'
      - 'drafts/world-cuisines/optimize-now.trigger'

permissions:
  contents: write

concurrency:
  group: optimize-world-cuisines
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optimize world cuisine images
        run: python scripts/optimize_world_cuisines.py
      - name: Verify native image loading
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('world-cuisines.html').read_text('utf-8')
          native=len(re.findall(r'<img\b[^>]*src="/assets/uploads/[^\"]+-16x9\.webp"',text,re.I))
          deferred=text.count('data-src="/assets/uploads/')
          eager=len(re.findall(r'<img\b[^>]*loading="eager"[^>]*src="/assets/uploads/[^\"]+-16x9\.webp"',text,re.I))
          assert native==95, native
          assert deferred==0, deferred
          assert 'world-cuisines-lazy.js' not in text
          assert eager>=4, eager
          print(f'Verified: {native} native images, {eager} eager first-row images, no JS placeholders')
          PY
      - name: Commit performance fix
        run: |
          rm -f drafts/world-cuisines/optimize-now.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-cuisines.html drafts/world-cuisines/optimize-now.trigger 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use native loading for World Cuisines images"
          git pull --rebase origin main
          git push origin HEAD:main
