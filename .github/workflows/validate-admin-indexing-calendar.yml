name: Validate admin indexing calendar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-admin-indexing-calendar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump admin runtime cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          text=p.read_text(encoding='utf-8')
          text,n=re.subn(r'assets/admin-runtime-loader\.js\?v=[^"\']+', 'assets/admin-runtime-loader.js?v=20260927-workflow-hardening3', text, count=1)
          if n!=1:
              raise SystemExit(f'admin runtime loader reference not found: {n}')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate JavaScript and markup
        run: |
          set -euo pipefail
          node --check assets/admin-runtime-loader.js
          node --check assets/admin-workflow-hardening.js
          node --check assets/admin-indexing-calendar.js
          grep -q "admin-indexing-calendar.js" assets/admin-runtime-loader.js
          grep -q "20260927-workflow-hardening3" admin.html
          grep -q "API вебмастера не подключён" assets/admin-indexing-calendar.js
          git diff --check
      - name: Commit cache activation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Activate daily calendar and indexing panel' || exit 0
          git pull --rebase origin main
          git push
