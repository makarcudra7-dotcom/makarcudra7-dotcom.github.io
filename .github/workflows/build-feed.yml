name: Build RSS feed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build feed.xml for validation
        run: node scripts/build-feed.js
      - name: Show feed status
        run: |
          if git diff --quiet -- feed.xml; then
            echo "feed.xml is up to date"
          else
            echo "feed.xml would change; canonical Google readiness workflow owns generated commits"
          fi
