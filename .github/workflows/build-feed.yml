name: Build RSS feed

on:
  push:
    branches: [main]
    paths:
      - 'data/posts.json'
      - 'scripts/build-feed.js'
      - '.github/workflows/build-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provkus-rss-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build feed.xml
        run: node scripts/build-feed.js
      - name: Commit RSS feed
        run: |
          if git diff --quiet -- feed.xml; then
            echo "feed.xml is up to date"
            exit 0
          fi
          git config user.name "provkus-feed"
          git config user.email "actions@users.noreply.github.com"
          git add feed.xml
          git commit -m "Update RSS feed"
          git push origin HEAD:main
