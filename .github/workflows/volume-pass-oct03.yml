name: October 3 volume pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run volume pass
        run: python scripts/volume_pass_oct03.py
      - name: Commit volume pass
        run: |
          git config user.name "provkus-scheduler"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scheduled-posts.json articles/*.html
          if git diff --cached --quiet; then
            echo "No volume changes"
          else
            git commit -m "Finish October 3 article volume pass"
            git push
          fi
