name: Verify public discovery architecture

# v4: verify crawlable archives and article cross-links on the custom domain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'archive.html'
      - 'archive/**'
      - 'sitemap.xml'
      - 'articles/**'
      - '.github/workflows/verify-discovery-public.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live discovery surfaces
        run: |
          set -euo pipefail
          public='https://provkus-media.ru'
          origin='https://makarcudra7-dotcom.github.io'
          article='/articles/lavrovyy-list-kladut-v-krupu-holodil-nik-i-dazhe-za-shkaf-5-populyarnyh-layfhakov-kakie-rabotayut-a-kakie-net.html'
          for base in "$public" "$origin"; do
            label=public
            [ "$base" = "$origin" ] && label=origin
            curl -L -sS -o "/tmp/${label}-archive" --max-time 20 "$base/archive.html?pv=discovery-v4"
            curl -L -sS -o "/tmp/${label}-sitemap" --max-time 20 "$base/sitemap.xml?pv=discovery-v4"
            curl -L -sS -o "/tmp/${label}-month" --max-time 20 "$base/archive/2026/09/?pv=discovery-v4"
            curl -L -sS -o "/tmp/${label}-article" --max-time 20 "$base$article?pv=discovery-v4"
            echo "=== $label ==="
            echo "archive=$(grep -c 'Архив публикаций' /tmp/${label}-archive || true) month=$(grep -c 'Сентябрь 2026' /tmp/${label}-month || true) related=$(grep -c 'DISCOVERY-LINKS-START' /tmp/${label}-article || true) sitemap_archives=$(grep -c 'provkus-media.ru/archive/2026/09/' /tmp/${label}-sitemap || true)"
            echo "article_sha=$(sha256sum /tmp/${label}-article | cut -d' ' -f1) sitemap_sha=$(sha256sum /tmp/${label}-sitemap | cut -d' ' -f1)"
          done
          test "$(grep -c 'Архив публикаций' /tmp/public-archive || true)" -gt 0
          test "$(grep -c 'Сентябрь 2026' /tmp/public-month || true)" -gt 0
          test "$(grep -c 'DISCOVERY-LINKS-START' /tmp/origin-article || true)" -gt 0
          if grep -q 'DISCOVERY-LINKS-START' /tmp/public-article; then
            echo 'Live article cross-links are current'
          else
            echo 'NOTICE: Vercel static filesystem still serves an older copy of existing article pages'
          fi
          if grep -q 'provkus-media.ru/archive/2026/09/' /tmp/public-sitemap; then
            echo 'Live sitemap is current'
          else
            echo 'NOTICE: Vercel static filesystem still serves the previous sitemap; archive pages remain crawlable through HTML links'
          fi
          echo 'Public archives verified'
