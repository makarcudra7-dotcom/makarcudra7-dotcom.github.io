name: Import October 3 evening photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-evening-images-oct03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import queued photos
        run: python3 scripts/import_scheduled_images.py
      - name: Commit imported photos
        run: |
          if git diff --quiet -- assets/uploads/; then
            echo "Photos already imported"
            exit 0
          fi
          git config user.name "provkus-scheduler"
          git config user.email "actions@users.noreply.github.com"
          git add assets/uploads/
          git commit -m "Import October 3 evening photos"
          git pull --rebase origin main
          git push origin HEAD:main
