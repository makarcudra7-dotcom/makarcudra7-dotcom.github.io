                "photoSource": "ProVkus",
                "content": "<p>С квашеной капустой важнее не сила рук, а точная пропорция. На 1 кг уже нашинкованной капусты беру 20 г соли: это 2% от массы. Капусту достаточно хорошо перемешать с солью и слегка помять до появления сока — превращать её руками в мягкую массу не нужно.</p><div class=\"recipe-facts\" aria-label=\"Кратко о рецепте\"><div><span>Подготовка</span><strong>20 мин</strong></div><div><span>Ферментация</span><strong>3–4 недели</strong></div><div><span>Соль</span><strong>20 г/кг</strong></div><div><span>Выход</span><strong>1 банка 1,5 л</strong></div></div><h2>Ингредиенты</h2><ul class=\"recipe-ingredients\"><li>Белокочанная капуста — 1 кг, вес после очистки и удаления кочерыжки</li><li>Соль без добавок — 20 г</li><li>Морковь — 80–100 г, по желанию</li><li>Тмин — 1/2 ч. л., по желанию</li></ul><h2>Как приготовить</h2><ol class=\"recipe-steps\"><li><p>Нашинкуйте капусту, взвесьте уже подготовленную массу и отмерьте соль: 20 г на каждый килограмм.</p></li><li><p>Перемешайте капусту с солью 2–3 минуты и несколько раз сожмите ладонями. Оставьте на 10 минут: соль сама вытянет часть сока.</p></li><li><p>Добавьте морковь и тмин, если используете. Плотно утрамбуйте капусту в чистую стеклянную банку небольшими порциями.</p></li><li><p>Капуста должна оставаться под собственным рассолом. Прижмите её чистым грузом для ферментации и оставьте сверху запас места для пузырьков и подъёма рассола.</p></li><li><p>Ферментируйте при прохладной комнатной температуре, ориентируясь на 18–22 °C. Когда вкус станет достаточно кислым, переставьте капусту в холодильник.</p></li></ol><h2>Почему не нужно долго мять</h2><p>Соль сама помогает вытянуть влагу из нарезанной капусты. Задача — добиться рассола и держать капусту погружённой, а не механически разрушить листья. Если капуста постоянно торчит над жидкостью, качество и безопасность ферментации ухудшаются.</p><h2>Важно</h2><p>Для ферментации соль — не только приправа. Не уменьшайте её «на глаз» и используйте чистую пищевую тару. Если появился неприятный гнилостный запах, выраженная слизь или признаки порчи, продукт лучше выбросить.</p>",
