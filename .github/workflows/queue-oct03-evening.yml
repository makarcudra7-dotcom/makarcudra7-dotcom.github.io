                "description": "Ленивый слоёный пирог из лаваша с тыквой и творожной заливкой: собирается прямо в форме и проводит в духовке около 30 минут.",
                "lead": "ленивый тыквенный пирог из лаваша слоями без лепки и сворачивания",
                "author": "Екатерина Рукопляс",
                "category": "Рецепты",
                "type": "recipe",
                "imageAlt": "Золотистый слоёный пирог с тыквой, нарезанный квадратами",
                "photoSource": "ProVkus",
                "content": "<p>Этот пирог я называю «Золотой ленивец»: здесь не нужно месить тесто, лепить края или сворачивать рулеты. Тонкий лаваш режу по форме, тыкву натираю, а дальше просто собираю всё слоями и отправляю в духовку.</p><div class=\"recipe-facts\" aria-label=\"Кратко о рецепте\"><div><span>Подготовка</span><strong>15 мин</strong></div><div><span>Духовка</span><strong>30 мин</strong></div><div><span>Всего</span><strong>45 мин</strong></div><div><span>Выход</span><strong>6 порций</strong></div></div><h2>Ингредиенты</h2><ul class=\"recipe-ingredients\"><li>Тыква очищенная — 500 г</li><li>Тонкий лаваш — 2 больших листа</li><li>Творог 5–9% — 300 г</li><li>Яйца — 2 шт.</li><li>Сметана — 150 г</li><li>Сахар — 3 ст. л.</li><li>Манная крупа — 2 ст. л.</li><li>Корица — 1 ч. л.</li><li>Ванильный сахар — 1 ч. л.</li><li>Сливочное масло — 15 г для формы</li></ul><h2>Как приготовить</h2><ol class=\"recipe-steps\"><li><p>Разогрейте духовку до 190 °C. Тыкву натрите на крупной тёрке и слегка отожмите только лишний свободный сок.</p></li><li><p>Смешайте творог, яйца, сметану, сахар, манку, корицу и ваниль до густой заливки.</p></li><li><p>Лаваш нарежьте пластами примерно по размеру формы. Форму смажьте маслом.</p></li><li><p>На дно положите лаваш, сверху распределите часть творожной смеси и тыквы. Повторяйте слои, пока продукты не закончатся. Верхний слой слегка смажьте оставшейся заливкой.</p></li><li><p>Выпекайте около 30 минут при 190 °C, пока верх не станет золотистым, а середина не схватится. Дайте постоять 10 минут и нарежьте квадратами.</p></li></ol><h2>Чтобы пирог не размок</h2><p>Очень сочную тыкву лучше слегка отжать, а готовый пирог не режьте прямо из духовки: за 10 минут начинка стабилизируется и слои будут держаться аккуратнее.</p>",
