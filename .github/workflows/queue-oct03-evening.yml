                "lead": "как размягчить засахарившееся варенье и что важно знать о хранении после прогрева",
                "author": "Эльвира Шайберт",
                "category": "Дом",
                "type": "guide",
                "imageAlt": "Густое ягодное варенье в стеклянной банке и ложка рядом",
                "photoSource": "ProVkus",
                "content": "<p>Сахарный хруст в варенье ещё не означает, что банка испорчена. Кристаллы могут появиться из-за избытка сахара, неполного растворения сахара при варке или слишком долгого приготовления. Если нет плесени, брожения, пузырьков и подозрительного запаха, небольшую порцию можно сделать снова удобной для намазывания.</p><h2>Один приём — мягко прогреть с жидкостью</h2><p>Переложите одну небольшую банку варенья в сотейник. На каждые примерно 225–250 г добавьте до 60 мл воды или подходящего фруктового сока. На самом слабом огне нагревайте, постоянно помешивая, пока плотная масса не разойдётся и сахарные кристаллы не растворятся.</p><p>После растворения прибавьте огонь, доведите смесь до полноценного кипения, продолжая мешать, затем снимите с плиты. Переложите в чистую сухую ёмкость, остудите и уберите в холодильник.</p><h2>Главное ограничение</h2><p>Это способ сделать засахарившееся или чрезмерно плотное варенье снова мягким, а не инструкция по повторному консервированию. После такого разбавления и прогрева не возвращайте банку на полку при комнатной температуре: National Center for Home Food Preservation рекомендует хранить переработанный таким способом продукт в холодильнике.</p><h2>Когда варенье не спасают</h2><p>Если есть плесень, признаки брожения, вспученная крышка, газообразование или неприятный запах, пробовать и переваривать продукт не стоит — его выбрасывают.</p><h2>Почему появляются кристаллы</h2><p>Чаще всего виноваты лишний сахар, кристаллы на стенках кастрюли или слишком долгая и медленная варка. Поэтому в следующий раз лучше готовить небольшими партиями и точно соблюдать пропорции проверенного рецепта.</p>",
