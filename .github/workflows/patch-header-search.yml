name: Patch header search
on:
  push:
    paths:
      - 'scripts/run-header-search.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch header and search
        run: python scripts/patch_header_search.py
      - name: Commit changes
        run: |
          rm -f scripts/run-header-search.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Simplify header and add live search'
          git pull --rebase origin main
          git push origin HEAD:main
