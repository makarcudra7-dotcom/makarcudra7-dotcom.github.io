name: JS syntax check
on:
  push:
    branches: [main]
    paths:
      - 'assets/*.js'
      - 'api/*.js'
      - 'scripts/*.js'
  pull_request:
    branches: [main]
    paths:
      - 'assets/*.js'
      - 'api/*.js'
      - 'scripts/*.js'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public and CMS scripts
        run: |
          node --check assets/app.js
          node --check assets/feed-v2.js
          node --check assets/admin.js
          node --check assets/admin-enhance.js
          node --check assets/admin-v3.js
          node --check assets/admin-server.js
          node --check assets/admin-photo-source.js
          node --check assets/admin-content-manager.js
          node --check assets/admin-quiz.js
          node --check assets/admin-quiz-toolbar.js
          node --check assets/admin-scheduler.js
          node --check assets/admin-editor-ui.js
          node --check assets/admin-fast-publish.js
          node --check assets/home-dynamic.js
          node --check api/publish.js
          node --check scripts/publish-scheduled.js
