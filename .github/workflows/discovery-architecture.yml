name: Rebuild discovery architecture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/posts.json'
      - 'articles/**'
      - 'calculators.html'
      - 'grams-spoons-cups.html'
      - 'portion-calculator.html'
      - 'assets/calculators.css'
      - 'assets/calculators.js'
      - 'assets/home-tools.css'
      - 'scripts/build_indexes.py'
      - 'scripts/build_discovery_archives.py'
      - 'scripts/enhance_article_links.py'
      - 'scripts/build_calculators_integration.py'
      - 'assets/admin-discover-guard.js'
      - '.github/workflows/discovery-architecture.yml'

permissions:
  contents: write

concurrency:
  group: provkus-discovery-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build canonical indexes
        run: python3 scripts/build_indexes.py
      - name: Build date archives and strengthen metadata
        run: python3 scripts/build_discovery_archives.py
      - name: Add static article cross-links and normalize dates
        run: python3 scripts/enhance_article_links.py
      - name: Integrate calculators
        run: python3 scripts/build_calculators_integration.py
      - name: Validate generated structure
        run: |
          set -euo pipefail
          test -f archive.html
          test -f sitemap.xml
          test -f feed.xml
          test -f calculators.html
          test -f grams-spoons-cups.html
          test -f portion-calculator.html
          test -f assets/home-tools.css
          grep -q 'Архив публикаций' archive.html
          grep -q 'provkus-media.ru/archive' sitemap.xml
          grep -q 'provkus-media.ru/calculators.html' sitemap.xml
          grep -q 'provkus-media.ru/grams-spoons-cups.html' sitemap.xml
          grep -q 'provkus-media.ru/portion-calculator.html' sitemap.xml
          grep -q 'HOME-TOOLS-START' index.html
          grep -q 'Калькуляторы ProVkus' index.html
          grep -q '<a href="/category.html"' index.html
          grep -q '<a href="/calculators.html"' index.html
          grep -q '<a href="/authors.html"' index.html
          grep -q '<a href="/archive.html"' index.html
          grep -q 'Кускус' assets/calculators.js
          grep -q 'Сгущённое молоко' assets/calculators.js
          grep -q 'admin-discover-guard.js' admin.html
          grep -q 'DISCOVERY-LINKS-START' articles/*.html
          node --check assets/calculators.js
          python3 -m py_compile scripts/build_discovery_archives.py scripts/enhance_article_links.py scripts/build_calculators_integration.py
      - name: Commit generated discovery files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' sitemap.xml feed.xml archive/ articles/
          if git diff --cached --quiet; then
            echo 'Discovery architecture already up to date'
            exit 0
          fi
          git commit -m 'Rebuild ProVkus discovery architecture'
          git push