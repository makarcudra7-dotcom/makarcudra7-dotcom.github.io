name: Wire fast admin scheduler

on:
  push:
    branches: [main]
    paths:
      - 'assets/admin-runtime-loader.js'
      - 'assets/admin-scheduler.js'
      - 'assets/admin-fast-publish.js'
      - 'assets/admin-discover-guard.js'
      - '.github/workflows/admin-scheduler-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire runtime into admin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assets/admin-discover-guard.js?v=20260925-precise2','assets/admin-discover-guard.js?v=20260925-schedule-fast2')
          tag='<script src="assets/admin-runtime-loader.js?v=20260925-schedule-fast2"></script>'
          if tag not in s:
              s=s.replace('</body></html>',tag+'</body></html>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Check scheduler wiring
        run: |
          node --check assets/admin-runtime-loader.js
          node --check assets/admin-scheduler.js
          node --check assets/admin-fast-publish.js
          grep -q 'admin-runtime-loader.js?v=20260925-schedule-fast2' admin.html
      - name: Commit admin wiring
        run: |
          git config user.name "provkus-admin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable reliable fast scheduling in CMS"
          git push
