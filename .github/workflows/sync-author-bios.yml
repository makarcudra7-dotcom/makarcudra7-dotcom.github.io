name: Sync author biographies
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync biographies locally
        run: python3 scripts/sync_author_bios.py
      - name: Validate author pages
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          authors=json.loads(Path('data/authors.json').read_text('utf-8'))
          for author in authors:
              text=Path(author['url']).read_text('utf-8')
              assert author['bio'] in text
              assert author['metaDescription'] in text
              assert 'Имеет профильное образование' not in text
          print('Validated', len(authors), 'author pages')
          PY
