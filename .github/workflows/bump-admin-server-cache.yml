name: Refresh CMS fallback UI
on:
  push:
    paths:
      - 'assets/admin-server.js'
      - '.github/workflows/bump-admin-server-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump admin server cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text()
          s=re.sub(r'assets/admin-server\.js\?v=[^"\']+', 'assets/admin-server.js?v=20260927-github-primary1', s, count=1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh CMS publishing transport cache'
            git pull --rebase origin main
            git push
          fi
