name: Run October 3 evening queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-queue-oct03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract and append evening entries
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, json, re
          from pathlib import Path

          helper = Path('.github/workflows/queue-oct03-evening.yml').read_text('utf-8')
          match = re.search(r'entries = \[(.*?)\]\n\n          existing =', helper, re.S)
          if not match:
              raise RuntimeError('Evening entries block not found')
          raw = '[' + match.group(1) + ']'
          raw = raw.replace(': false', ': False').replace(': true', ': True')
          entries = ast.literal_eval(raw)

          path = Path('.github/scheduled-posts.json')
          queue = json.loads(path.read_text('utf-8')) if path.exists() else []
          by_slug = {item.get('slug'): item for item in queue if isinstance(item, dict) and item.get('slug')}
          for item in entries:
              by_slug[item['slug']] = item
          queue = sorted(by_slug.values(), key=lambda x: x.get('publishAt', ''))
          path.write_text(json.dumps(queue, ensure_ascii=False, indent=2) + '\n', 'utf-8')
          print('Queued:', ', '.join(item['slug'] for item in entries))
          PY
      - name: Commit queue
        run: |
          if git diff --quiet -- .github/scheduled-posts.json; then
            echo "Evening publications already queued"
            exit 0
          fi
          git config user.name "provkus-scheduler"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scheduled-posts.json
          git commit -m "Schedule October 3 evening materials"
          git pull --rebase origin main
          git push origin HEAD:main
