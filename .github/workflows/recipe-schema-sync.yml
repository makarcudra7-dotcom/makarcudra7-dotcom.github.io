name: Sync recipe structured data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/add_recipe_schema.py'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add schema from visible ingredients and steps
        run: python3 scripts/add_recipe_schema.py
      - name: Install audit dependency
        run: python3 -m pip install Pillow
      - name: Validate site
        run: python3 scripts/audit_site.py
      - name: Commit only recipe metadata
        run: |
          if git diff --quiet -- articles/; then
            echo 'No eligible recipes to update'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/
          git commit -m 'Add Recipe schema from visible ingredients and steps'
          git push
