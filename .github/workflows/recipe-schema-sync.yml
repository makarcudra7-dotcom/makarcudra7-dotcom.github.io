name: Sync recipe structured data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/add_recipe_schema.py'
      - '.github/workflows/recipe-schema-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add schema from visible ingredients and steps
        run: python3 scripts/add_recipe_schema.py
      - name: Validate recipe structured data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          posts=json.loads(Path('data/posts.json').read_text('utf-8'))
          errors=[]
          for post in posts:
              if str(post.get('type') or '').casefold()!='recipe':
                  continue
              page=Path('articles')/(post['slug']+'.html')
              if not page.exists():
                  continue
              text=page.read_text('utf-8')
              for raw in __import__('re').findall(r'<script type="application/ld\+json"[^>]*>(.*?)</script>',text,__import__('re').S):
                  try: data=json.loads(raw)
                  except ValueError: continue
                  nodes=data.get('@graph',[data]) if isinstance(data,dict) else []
                  if any(isinstance(node,dict) and node.get('@type')=='Recipe' and node.get('recipeIngredient') and node.get('recipeInstructions') for node in nodes):
                      break
              else:
                  errors.append(post['slug'])
          if errors:
              raise SystemExit('Missing Recipe data: '+', '.join(errors))
          print('Recipe schema validated')
          PY
      - name: Commit only recipe metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/add_recipe_schema.py
            if git diff --quiet -- articles/ data/posts.json; then
              echo 'No eligible recipes to update'
              exit 0
            fi
            git add articles/ data/posts.json
            git commit -m 'Add Recipe schema from visible ingredients and steps'
            if git push origin HEAD:main; then exit 0; fi
            echo "Main changed during recipe schema sync; retrying ($attempt/5)"
          done
          exit 1
