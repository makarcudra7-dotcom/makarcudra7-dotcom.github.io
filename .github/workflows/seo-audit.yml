name: SEO audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: pip install pillow
      - name: Rebuild all discovery surfaces in CI
        run: |
          python3 scripts/seo_hardening.py
          python3 scripts/build_indexes.py
          python3 scripts/build_discovery_archives.py
          python3 scripts/enhance_article_links.py
          python3 scripts/build_calculators_integration.py
          python3 scripts/quality_sync.py
          python3 scripts/post_quality_hardening.py
      - name: Run offline Google readiness audit
        run: |
          python3 scripts/check_indexing_surfaces.py
          python3 scripts/audit_site.py
