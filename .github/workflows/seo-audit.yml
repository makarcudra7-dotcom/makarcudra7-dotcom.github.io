name: SEO audit
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: pip install pillow
      - name: Rebuild sitemap and feed in CI
        run: python3 scripts/build_indexes.py
      - name: Run offline Google readiness audit
        run: python3 scripts/audit_site.py
