name: Trust and Discover fixes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_trust_signals.py'
      - '.github/workflows/trust-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply trust fixes
        run: python3 scripts/fix_trust_signals.py
      - name: Validate trust fixes
        run: python3 scripts/fix_trust_signals.py --check
      - name: Commit fixes
        run: |
          git config user.name "provkus-trust-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articles author-*.html scripts/audit_site.py scripts/publish-scheduled.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix article trust signals and source standards"
          git push
