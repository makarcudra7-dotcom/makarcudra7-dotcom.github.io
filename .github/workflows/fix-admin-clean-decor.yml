name: Fix admin and clean legacy decor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-clean-decor.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin and cache versions
        shell: python
        run: |
          from pathlib import Path
          import re

          admin = Path('admin.html')
          text = admin.read_text(encoding='utf-8')
          text = re.sub(r'assets/admin\.js(?:\?[^"\']*)?', 'assets/admin.js?v=20260925-adminfix1', text)
          text = re.sub(r'assets/admin-enhance\.js(?:\?[^"\']*)?', 'assets/admin-enhance.js?v=20260925-adminfix1', text)
          text = re.sub(r'assets/admin-photo-source\.js(?:\?[^"\']*)?', 'assets/admin-photo-source.js?v=20260925-adminfix1', text)
          text = re.sub(r'assets/admin-fixes\.js(?:\?[^"\']*)?', 'assets/admin-fixes.js?v=20260925-adminfix1', text)
          if 'assets/admin-server.js' not in text:
              text = text.replace('</body>', '<script src="assets/admin-server.js?v=20260925-adminfix1"></script></body>')
          admin.write_text(text, encoding='utf-8')

          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'(/?assets/public\.css)(?:\?[^"\']*)?', r'\1?v=20260925-clean1', s)
              s = re.sub(r'((?:\.\./|/)?assets/app\.js)(?:\?[^"\']*)?', r'\1?v=20260925-clean1', s)
              p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html '*.html' articles assets || true
          git add -u
          git commit -m "Repair admin loading and purge cached leaf assets"
          git push
