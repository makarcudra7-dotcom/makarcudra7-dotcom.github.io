name: Finalize publication workflow hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-workflow-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch scheduler status, queue safety and category filter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('scripts/publish-scheduled.js')
          text = p.read_text(encoding='utf-8')
          old = "const active=queue.filter(x=>!paused.includes(x));\nconst due=active.filter(x=>new Date(x.publishAt).getTime()<=now),pending=[...paused,...active.filter(x=>new Date(x.publishAt).getTime()>now)];"
          new = "const active=queue.filter(x=>!paused.includes(x));\nconst failed=active.filter(x=>x?.status==='error'||x?.post?.status==='error');\nconst retryable=active.filter(x=>!failed.includes(x));\nconst due=retryable.filter(x=>new Date(x.publishAt).getTime()<=now),pending=[...paused,...failed,...retryable.filter(x=>new Date(x.publishAt).getTime()>now)];"
          if old not in text:
              raise SystemExit('active/due anchor not found')
          text = text.replace(old, new, 1)

          match = re.search(r"for\(const item of due\.sort\(\(a,b\)=>new Date\(a\.publishAt\)-new Date\(b\.publishAt\)\)\)\{.*?console\.log\(`Published scheduled material: \$\{rec\.slug\}`\)\}\n", text, re.S)
          if not match:
              raise SystemExit('publish loop not found')
          lines = [
              "for(const item of due.sort((a,b)=>new Date(a.publishAt)-new Date(b.publishAt))){",
              "  if(!item?.slug||!item?.material||!item?.post)continue;",
              "  item.status='publishing';item.post.status='publishing';",
              "  try{",
              "    const published=item.publishAt||item.post.publishedAt||new Date().toISOString();",
              "    const updated=item.post.updatedAt;",
              "    const modified=updated&&new Date(updated).getTime()>=new Date(published).getTime()?updated:published;",
              "    const rec={...item.post,status:'published',featured:item.post.featured??item.material.featured??false,popular:item.post.popular??item.material.popular??false,newsletter:item.post.newsletter??item.material.newsletter??false,publishedAt:published,updatedAt:modified};",
              "    fs.mkdirSync('articles',{recursive:true});",
              "    fs.writeFileSync(path.join('articles',item.slug+'.html'),render({...item,post:rec,publishAt:published}));",
              "    if(rec.featured)posts=posts.map(p=>({...p,featured:false}));",
              "    posts=[rec,...posts.filter(p=>p.slug!==rec.slug)];",
              "    if(rec.newsletter){newsletter=[{id:`${rec.slug}-${Date.now()}-${newsletter.length}`,slug:rec.slug,sentAt:published},...newsletter].slice(0,60);newsletterChanged=true;console.log(`Queued newsletter signal for published material: ${rec.slug}`)}",
              "    changed=true;console.log(`Published scheduled material: ${rec.slug}`)",
              "  }catch(error){",
              "    item.status='error';item.post.status='error';item.errorMessage=String(error?.message||error||'Неизвестная ошибка публикации');item.failedAt=new Date().toISOString();item.attempts=Number(item.attempts||0)+1;",
              "    pending.push(item);changed=true;console.error(`Scheduled publication failed: ${item.slug}: ${item.errorMessage}`)",
              "  }",
              "}",
              "",
          ]
          text = text[:match.start()] + '\n'.join(lines) + text[match.end():]
          p.write_text(text, encoding='utf-8')

          p = Path('assets/admin-scheduler.js')
          text = p.read_text(encoding='utf-8')
          old = "const post=makePost(o,img,images),item={slug:o.slug,publishAt:post.publishedAt,createdAt:new Date().toISOString(),material:o,post};"
          new = "const post={...makePost(o,img,images),status:'queued'},item={slug:o.slug,publishAt:post.publishedAt,createdAt:new Date().toISOString(),status:'queued',material:{...o,status:'queued'},post};"
          if old not in text:
              raise SystemExit('schedule item anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('assets/admin-operations.js')
          text = p.read_text(encoding='utf-8')
          old = "let busy=false,filters={status:'all',author:'all',date:''},renderPending=false,newsletter=[],sitemapCache=null,healthReport={};"
          new = "let busy=false,filters={status:'all',author:'all',date:'',category:'all'},renderPending=false,newsletter=[],sitemapCache=null,healthReport={};"
          if old in text:
              text = text.replace(old, new, 1)

          old = "const status=isDraft?'draft':item?'scheduled':'published',author=p?.author||item?.post?.author||tr.children[2]?.textContent||'',date=(p?.publishedAt||item?.publishAt||'').slice(0,10);"
          new = "const status=isDraft?'draft':item?'scheduled':'published',author=p?.author||item?.post?.author||tr.children[2]?.textContent||'',category=p?.category||item?.post?.category||item?.material?.category||'',date=(p?.publishedAt||item?.publishAt||'').slice(0,10);"
          if old not in text:
              raise SystemExit('filter row anchor not found')
          text = text.replace(old, new, 1)

          old = "&&(filters.author==='all'||filters.author===author)&&(!filters.date||filters.date===date);"
          new = "&&(filters.author==='all'||filters.author===author)&&(filters.category==='all'||filters.category===category)&&(!filters.date||filters.date===date);"
          if old not in text:
              raise SystemExit('filter match anchor not found')
          text = text.replace(old, new, 1)

          old = "const authors=[...new Set(posts().map(x=>x.author).filter(Boolean))].sort();"
          new = "const authors=[...new Set(posts().map(x=>x.author).filter(Boolean))].sort();const categories=[...new Set([...posts().map(x=>x.category),...queued().map(x=>x.post?.category||x.material?.category)].filter(Boolean))].sort();"
          if old not in text:
              raise SystemExit('filter options anchor not found')
          text = text.replace(old, new, 1)

          old = '<select id="pvAuthor"><option value="all">Все авторы</option>${authors.map(x=>`<option>${esc(x)}</option>`).join(\'\')}</select><input type="date" id="pvDate"'
          new = '<select id="pvAuthor"><option value="all">Все авторы</option>${authors.map(x=>`<option>${esc(x)}</option>`).join(\'\')}</select><select id="pvCategory"><option value="all">Все рубрики</option>${categories.map(x=>`<option>${esc(x)}</option>`).join(\'\')}</select><input type="date" id="pvDate"'
          if old not in text:
              raise SystemExit('category select anchor not found')
          text = text.replace(old, new, 1)

          old = "$('#pvAuthor').onchange=e=>{filters.author=e.target.value;applyFilters()};$('#pvDate').onchange=e=>{filters.date=e.target.value;applyFilters()};"
          new = "$('#pvAuthor').onchange=e=>{filters.author=e.target.value;applyFilters()};$('#pvCategory').onchange=e=>{filters.category=e.target.value;applyFilters()};$('#pvDate').onchange=e=>{filters.date=e.target.value;applyFilters()};"
          if old not in text:
              raise SystemExit('category handler anchor not found')
          text = text.replace(old, new, 1)

          old = "filters={status:'all',author:'all',date:''};$('#pvStatus').value='all';$('#pvAuthor').value='all';$('#pvDate').value='';"
          new = "filters={status:'all',author:'all',date:'',category:'all'};$('#pvStatus').value='all';$('#pvAuthor').value='all';$('#pvCategory').value='all';$('#pvDate').value='';"
          if old not in text:
              raise SystemExit('filter reset anchor not found')
          text = text.replace(old, new, 1)

          old = "if(value===null)return;const date=new Date(value);if(!Number.isFinite(date.getTime())||date<=new Date())return message('Выберите корректное будущее время');\n if(busy)return;showBusy(true);"
          new = "if(value===null)return;const date=new Date(value);if(!Number.isFinite(date.getTime())||date<=new Date())return message('Выберите корректное будущее время');\n if(!confirm(`Перенести публикацию с ${old.toLocaleString('ru-RU')} на ${date.toLocaleString('ru-RU')}?`))return;\n if(busy)return;showBusy(true);"
          if old not in text:
              raise SystemExit('reschedule confirmation anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('admin.html')
          text = p.read_text(encoding='utf-8')
          text, n = re.subn(r'assets/admin-runtime-loader\.js\?v=[^"\']+', 'assets/admin-runtime-loader.js?v=20260927-workflow-hardening2', text, count=1)
          if n != 1:
              raise SystemExit('admin runtime loader cache anchor not found')
          text = re.sub(r'assets/admin-operations\.js\?v=[^"\']+', 'assets/admin-operations.js?v=20260927-workflow-hardening2', text, count=1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify workflow hardening
        run: |
          set -euo pipefail
          node --check scripts/publish-scheduled.js
          node --check assets/admin-scheduler.js
          node --check assets/admin-operations.js
          node --check assets/admin-runtime-loader.js
          node --check assets/admin-workflow-hardening.js
          grep -q "item.status='error'" scripts/publish-scheduled.js
          grep -q 'id="pvCategory"' assets/admin-operations.js
          grep -q "data-pv-retry" assets/admin-workflow-hardening.js
          grep -q "pvBulkAuthor" assets/admin-workflow-hardening.js
          grep -q "pv-mobile-modal" assets/admin-workflow-hardening.js
          grep -q '20260927-workflow-hardening2' admin.html
          git diff --check

      - name: Commit hardening
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publish-scheduled.js assets/admin-scheduler.js assets/admin-operations.js admin.html
          git commit -m 'Complete publication statuses retry filters and queue safety' || exit 0
          git pull --rebase origin main
          git push
