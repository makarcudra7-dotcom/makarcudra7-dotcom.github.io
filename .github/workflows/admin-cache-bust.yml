name: Refresh CMS asset cache

on:
  push:
    branches: [main]
    paths:
      - 'assets/admin-server.js'
      - 'assets/admin-photo-source.js'
      - 'assets/admin-edit-fix.js'
      - 'assets/admin-publish-recovery.js'
      - '.github/workflows/admin-cache-bust.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix publish contract and refresh CMS cache versions
        env:
          VERSION: cms-${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          version = os.environ['VERSION'][:16]

          core = Path('assets/admin.js')
          text = core.read_text(encoding='utf-8')
          old = "flash('Материал отправлен в GitHub Pages')}catch(e){flash(e.message)}finally{"
          new = "flash('Материал отправлен в GitHub Pages');return true}catch(e){flash(e.message);return false}finally{"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not patch publish success contract')
          core.write_text(text, encoding='utf-8')

          loader = Path('assets/admin-photo-source.js')
          text = loader.read_text(encoding='utf-8')
          text, n = re.subn(r"const V='[^']+';", f"const V='{version}';", text, count=1)
          if n != 1:
              raise SystemExit('Could not refresh admin-photo-source version')
          loader.write_text(text, encoding='utf-8')

          edit = Path('assets/admin-edit-fix.js')
          text = edit.read_text(encoding='utf-8')
          text, n = re.subn(r"assets/admin-publish-recovery\.js\?v=[^'\"]+", f"assets/admin-publish-recovery.js?v={version}", text, count=1)
          if n != 1:
              raise SystemExit('Could not refresh publish recovery version')
          edit.write_text(text, encoding='utf-8')

          admin = Path('admin.html')
          html = admin.read_text(encoding='utf-8')
          replacements = [
              (r'assets/admin-photo-source\.js\?v=[^"\']+', f'assets/admin-photo-source.js?v={version}', 'admin-photo-source'),
              (r'assets/admin\.js(?:\?v=[^"\']+)?', f'assets/admin.js?v={version}', 'admin.js'),
              (r'assets/admin-edit-fix\.js(?:\?v=[^"\']+)?', f'assets/admin-edit-fix.js?v={version}', 'admin-edit-fix'),
          ]
          for pattern, replacement, label in replacements:
              html, n = re.subn(pattern, replacement, html, count=1)
              if n != 1:
                  raise SystemExit(f'Could not refresh {label} loader version')
          admin.write_text(html, encoding='utf-8')
          PY
      - name: Check CMS JavaScript
        run: |
          node --check assets/admin.js
          node --check assets/admin-server.js
          node --check assets/admin-photo-source.js
          node --check assets/admin-edit-fix.js
          node --check assets/admin-publish-recovery.js
          node --check assets/admin-fast-publish.js
      - name: Commit refreshed versions
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html assets/admin.js assets/admin-photo-source.js assets/admin-edit-fix.js
          git commit -m 'Refresh CMS publish recovery cache'
          git push
