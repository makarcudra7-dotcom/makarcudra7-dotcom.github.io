name: Attach October 3 evening photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-evening-images-oct03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Attach photos to queued materials
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/scheduled-posts.json')
          items = json.loads(path.read_text('utf-8'))
          patches = {
            'kapustu-ne-mnu-20-g-soli-na-kilogramm': {
              'source': 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/71b44cd5-4507-4f39-86b5-239be863f38e.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjQxZGJlOTIxNjliY2Y4YiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE2NDMwNn0.poLcnrGKGVfyuWoGTdhoD2qRJnn4PHif6BCfMcFQc1E',
              'image': '/assets/uploads/kvashenaya-kapusta-oct03.png',
            },
            'zasaharilos-varenie-spasayu-za-odin-priem': {
              'source': 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/cf9e341e-9fcc-4c60-8f0f-dfdb42646f4b.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDBiYjlhYjFmOTc5YTUyYyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE0OTM2MX0.bYZLl8ivHxHT8cLgg2akME7LRxPlXYFVMKW9C-6dS3c',
              'image': '/assets/uploads/zasaharilos-varenie-oct03.png',
            },
            'zolotoy-lenivets-tykva-sloyami-lavash': {
              'source': 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/9cf28af5-6a3f-451a-8217-e38dd55f5f89.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzdiYzZhYjFmNWU1Yzk0MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE0NjE2MX0.bOXIhIt7BFiKHhnMC1mvPwO7EoZ7r3kugH2TLai_Rpw',
              'image': '/assets/uploads/zolotoy-lenivets-oct03.png',
            },
          }
          found = set()
          for item in items:
            slug = item.get('slug')
            if slug not in patches:
              continue
            patch = patches[slug]
            item['sourceImageUrl'] = patch['source']
            item.setdefault('post', {})['image'] = patch['image']
            found.add(slug)
          missing = set(patches) - found
          if missing:
            raise SystemExit('Missing queued slugs: ' + ', '.join(sorted(missing)))
          path.write_text(json.dumps(items, ensure_ascii=False, indent=2) + '\n', 'utf-8')
          PY
      - name: Commit queue photo links
        run: |
          git config user.name "provkus-scheduler"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scheduled-posts.json
          git commit -m "Attach photos to October 3 evening materials"
          git pull --rebase origin main
          git push origin HEAD:main
