name: Optimize homepage hero

concurrency:
  group: provkus-homepage-optimization
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'data/posts.json'
      - 'scripts/optimize_home_hero.py'
      - 'scripts/optimize_home_images.py'
      - 'scripts/optimize_home_markup.py'
      - 'scripts/optimize_article_images.py'
      - '.github/workflows/optimize-home-hero.yml'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Rebuild and optimize homepage placements
        run: |
          git config user.name "provkus-performance-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/build_indexes.py
            python3 scripts/optimize_home_images.py
            python3 scripts/optimize_home_hero.py
            python3 scripts/optimize_home_markup.py
            python3 scripts/optimize_article_images.py
            git add index.html articles assets/uploads
            git restore --worktree .
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh homepage placements and responsive homepage images"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          echo 'Could not publish homepage optimization after concurrent updates' >&2
          exit 1
