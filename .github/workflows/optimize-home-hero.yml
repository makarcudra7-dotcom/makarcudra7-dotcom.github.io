name: Optimize homepage hero

concurrency:
  group: provkus-scheduled-publishing
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/posts.json'
      - 'scripts/optimize_home_hero.py'
      - '.github/workflows/optimize-home-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'responsive homepage hero images')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Build responsive hero images
        run: |
          python3 scripts/build_indexes.py
          python3 scripts/optimize_home_hero.py

      - name: Commit responsive hero assets
        run: |
          git config user.name "provkus-performance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/uploads archive/ archive.html calculators.html news.html category.html authors.html author-*.html recipes.html products.html home-storage.html food-safety.html sitemap.xml feed.xml dzen.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh homepage placements and responsive homepage hero images"
          git pull --rebase origin main
          git push origin HEAD:main
