name: Build recipe tools index
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/posts.json'
      - 'articles/**.html'
      - '.github/scheduled-posts.json'
      - 'scripts/build_recipe_tools.py'
      - 'scripts/ensure_recipe_template.py'
      - 'scripts/apply_recipe_template_backfill.py'
      - 'assets/provkus-tools-v2.js'
      - 'assets/provkus-tools.css'
      - 'assets/admin-recipe-template.js'
      - '.github/workflows/build-recipe-tools.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply full recipe template data
        run: python3 scripts/apply_recipe_template_backfill.py
      - name: Ensure recipe assets on every recipe
        run: python3 scripts/ensure_recipe_template.py
      - name: Build recipe index and inject tools
        run: python3 scripts/build_recipe_tools.py
      - name: Validate recipe templates and index
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          posts=json.load(open('data/posts.json',encoding='utf-8'))
          data=json.load(open('data/recipe-index.json',encoding='utf-8'))
          assert isinstance(data,list) and data, 'recipe index is empty'
          assert all(x.get('slug') and x.get('url') for x in data)
          recipes=[p for p in posts if str(p.get('type','')).lower()=='recipe' or str(p.get('category','')).strip().lower()=='рецепты']
          missing=[]
          for p in recipes:
            path=Path('articles')/(p['slug']+'.html')
            if not path.exists():
              missing.append(p['slug']+':file');continue
            text=path.read_text(encoding='utf-8')
            if 'pv-recipe-marker' not in text or '/assets/provkus-tools.css' not in text or '/assets/provkus-tools-v2.js' not in text:
              missing.append(p['slug']+':assets')
          assert not missing, 'recipe template missing: '+', '.join(missing[:20])
          print('recipes',len(recipes),'indexed',len(data),'with ingredients',sum(bool(x.get('ingredients')) for x in data))
          PY
      - name: Commit generated recipe template data
        run: |
          if git diff --quiet -- .github/scheduled-posts.json data/posts.json data/recipe-index.json articles; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'provkus-cms-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/scheduled-posts.json data/posts.json data/recipe-index.json articles
          git commit -m 'Refresh full recipe templates'
          git pull --rebase origin main
          git push
