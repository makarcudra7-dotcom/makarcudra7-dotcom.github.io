name: Final polish v5
on:
  push:
    branches: [main]
    paths:
      - 'scripts/final_polish_v5.py'
      - '.github/workflows/final-polish-v5.yml'
      - '.image-bundle-v5/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image tools
        run: python3 -m pip install --quiet pillow
      - name: Repack covers, headlines and cards
        run: python3 scripts/final_polish_v5.py
      - name: Validate output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          posts=json.loads(Path('data/posts.json').read_text())
          assert len(posts)==24, len(posts)
          assert len({p['image'] for p in posts})==24
          assert all('covers-v5' in p['image'] for p in posts)
          assert all(p.get('photoSource')=='provkus-media.ru' for p in posts)
          assert Path('assets/authors/elvira-v2.jpg').exists()
          assert all((Path('articles')/(p['slug']+'.html')).exists() for p in posts)
          print('validated',len(posts),'posts')
          PY
      - name: Commit final polish
        run: |
          git config user.name "provkus-polish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json articles index.html category.html authors.html author-*.html assets/covers-v5 assets/authors/elvira-v2.jpg assets/admin.js assets/admin-enhance.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Final v5: generated covers, headlines and unified feed"
          git push
