name: Refresh CMS quality audit
on:
  push:
    branches: [main]
    paths:
      - 'assets/admin-quality-v2.js'
      - 'assets/admin-discover-guard.js'
      - '.github/workflows/admin-quality-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'provkus-cms-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh quality-audit cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text('utf-8')
          import re
          s=re.sub(r'assets/admin-discover-guard\.js\?v=[^"\']+', 'assets/admin-discover-guard.js?v=20260925-precise2', s)
          p.write_text(s,'utf-8')
          PY
      - name: Commit cache key
        run: |
          git config user.name "provkus-cms-bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh CMS quality audit cache key"
          git push
