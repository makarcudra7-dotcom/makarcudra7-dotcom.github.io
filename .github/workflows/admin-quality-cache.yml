name: Check CMS quality audit
on:
  push:
    branches: [main]
    paths:
      - 'assets/admin-quality-v2.js'
      - 'assets/admin-discover-guard.js'
      - '.github/workflows/admin-quality-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current audit scripts
        run: |
          node --check assets/admin-quality-v2.js
          node --check assets/admin-discover-guard.js
          grep -q 'assets/admin-quality-v2.js' assets/admin-discover-guard.js
