name: Mobile performance audit

# Final post-deploy production regression check.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/app.js'
      - 'assets/public.css'
      - 'assets/site-ui.css'
      - 'assets/theme.css'
      - 'assets/metrika.js'
      - 'scripts/optimize_home_images.py'
      - 'scripts/optimize_home_markup.py'
      - '.github/workflows/performance-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Try Google PageSpeed Insights mobile
        id: psi
        continue-on-error: true
        run: |
          curl -fsS --get 'https://www.googleapis.com/pagespeedonline/v5/runPagespeed' \
            --data-urlencode 'url=https://provkus-media.ru/' \
            --data-urlencode 'strategy=mobile' \
            --data-urlencode 'category=PERFORMANCE' \
            --data-urlencode 'category=ACCESSIBILITY' \
            --data-urlencode 'category=BEST_PRACTICES' \
            --data-urlencode 'category=SEO' \
            -o psi.json
          python3 - <<'PY'
          import json, sys
          d=json.load(open('psi.json',encoding='utf-8'))
          lr=d.get('lighthouseResult')
          if not lr:
              print(json.dumps(d,ensure_ascii=False)[:2000])
              sys.exit(1)
          cats=lr['categories']; audits=lr['audits']
          def score(k): return round(cats[k]['score']*100)
          def val(k): return audits[k].get('displayValue','n/a')
          print('PAGESPEED_MOBILE')
          print('Performance:', score('performance'))
          print('Accessibility:', score('accessibility'))
          print('Best Practices:', score('best-practices'))
          print('SEO:', score('seo'))
          print('FCP:', val('first-contentful-paint'))
          print('LCP:', val('largest-contentful-paint'))
          print('Speed Index:', val('speed-index'))
          print('TBT:', val('total-blocking-time'))
          print('CLS:', val('cumulative-layout-shift'))
          print('--- ACCESSIBILITY FAILURES ---')
          refs=(cats.get('accessibility') or {}).get('auditRefs') or []
          for ref in refs:
              a=audits.get(ref.get('id')) or {}
              if a.get('score') not in (None,1):
                  print(ref.get('id'), 'score=',a.get('score'), 'title=',a.get('title'))
                  for item in ((a.get('details') or {}).get('items') or [])[:8]:
                      print(' ',json.dumps(item,ensure_ascii=False,default=str)[:1800])
          PY

      - name: Install Lighthouse fallback
        if: steps.psi.outcome == 'failure'
        run: npm install --global lighthouse

      - name: Run Lighthouse mobile fallback
        if: steps.psi.outcome == 'failure'
        run: |
          lighthouse 'https://provkus-media.ru/' \
            --quiet \
            --chrome-flags='--headless --no-sandbox' \
            --form-factor=mobile \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=lighthouse.json
          python3 - <<'PY'
          import json
          d=json.load(open('lighthouse.json',encoding='utf-8'))
          cats=d['categories']; audits=d['audits']
          def score(k): return round(cats[k]['score']*100)
          def val(k): return audits[k].get('displayValue','n/a')
          print('LIGHTHOUSE_MOBILE_FALLBACK')
          print('Performance:', score('performance'))
          print('Accessibility:', score('accessibility'))
          print('Best Practices:', score('best-practices'))
          print('SEO:', score('seo'))
          print('FCP:', val('first-contentful-paint'))
          print('LCP:', val('largest-contentful-paint'))
          print('Speed Index:', val('speed-index'))
          print('TBT:', val('total-blocking-time'))
          print('CLS:', val('cumulative-layout-shift'))
          print('--- ACCESSIBILITY FAILURES ---')
          refs=(cats.get('accessibility') or {}).get('auditRefs') or []
          for ref in refs:
              a=audits.get(ref.get('id')) or {}
              if a.get('score') not in (None,1):
                  print(ref.get('id'), 'score=',a.get('score'), 'title=',a.get('title'))
                  for item in ((a.get('details') or {}).get('items') or [])[:8]:
                      print(' ',json.dumps(item,ensure_ascii=False,default=str)[:1800])
          print('--- BOTTLENECK DIAGNOSTICS ---')
          wanted=(
              'long-tasks','mainthread-work-breakdown','bootup-time','layout-shifts',
              'cls-culprits-insight','render-blocking-insight','lcp-breakdown-insight',
              'image-delivery-insight','third-parties-insight','network-dependency-tree-insight'
          )
          for key in wanted:
              a=audits.get(key)
              if not a:
                  continue
              print(f'[{key}] score={a.get("score")} value={a.get("displayValue","")}')
              details=a.get('details') or {}
              items=details.get('items') or []
              for item in items[:10]:
                  if isinstance(item,dict):
                      keep={k:v for k,v in item.items() if k in ('url','duration','startTime','total','wastedMs','wastedBytes','score','subItems','node','source')}
                      text=json.dumps(keep,ensure_ascii=False,default=str)
                      print(' ',text[:1400])
          PY
