name: Rebuild sitemap and feed
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate discovery indexes for validation
        run: python3 scripts/build_indexes.py
      - name: Show generated status
        run: |
          git diff --stat -- sitemap.xml feed.xml || true
          echo "Canonical Google readiness workflow owns generated commits"
