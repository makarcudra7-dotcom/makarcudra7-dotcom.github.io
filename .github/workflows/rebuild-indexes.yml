name: Rebuild sitemap and feed
on:
  push:
    branches: [main]
    paths:
      - 'data/posts.json'
      - 'scripts/build_indexes.py'
      - '.github/workflows/rebuild-indexes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate discovery indexes
        run: |
          python3 scripts/build_indexes.py
      - name: Commit generated indexes
        run: |
          git config user.name "provkus-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml feed.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update sitemap and feed [skip ci]"
          git push
