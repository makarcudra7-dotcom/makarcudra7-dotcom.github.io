name: Install CMS edit hotfix

on:
  push:
    paths:
      - '.github/workflows/install-admin-edit-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add edit hotfix to admin
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="assets/admin-edit-fix.js?v=20260924-edit2"></script>'
          if 'assets/admin-edit-fix.js' not in s:
              s = s.replace('</body></html>', tag + '</body></html>')
          else:
              import re
              s = re.sub(r'<script src="assets/admin-edit-fix\.js[^\"]*"></script>', tag, s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Load CMS article edit hotfix'
          git push
