name: Check published pages and images
on:
  push:
    branches: [main]
    paths:
      - 'scripts/check_publication_health.py'
      - '.github/workflows/publication-health.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: provkus-publication-health
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test health checker
        run: python3 -m unittest tests/test_publication_health.py
      - name: Check deployed articles
        run: python3 scripts/check_publication_health.py
      - name: Save changed health results
        run: |
          git config user.name "provkus-health-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/publication-health.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update publication health results"
          git pull --rebase origin main
          git push
