name: Prepare publication covers
on:
  push:
    branches: [main]
    paths:
      - 'drafts/publication-images/*.png'
      - '.github/workflows/prepare-publication-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: provkus-publication-covers
  cancel-in-progress: false
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Create small WebP covers before publication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          out = Path("assets/uploads")
          out.mkdir(parents=True, exist_ok=True)
          for source in sorted(Path("drafts/publication-images").glob("*.png")):
              base = out / source.stem
              if Path(str(base) + "-cover.webp").exists():
                  continue
              with Image.open(source) as opened:
                  image = ImageOps.exif_transpose(opened).convert("RGB")
                  cover = ImageOps.fit(image, (1600, 900), Image.Resampling.LANCZOS)
                  cover.save(str(base) + "-cover.webp", "WEBP", quality=80, method=6)
                  for width in (480, 960, 1280):
                      cover.resize((width, round(width * 9 / 16)), Image.Resampling.LANCZOS).save(str(base) + f"-cover-{width}w.webp", "WEBP", quality=78, method=6)
                  for suffix, size in (("4x3", (1600,1200)), ("1x1", (1200,1200))):
                      ImageOps.fit(image, size, Image.Resampling.LANCZOS).save(str(base) + f"-{suffix}.webp", "WEBP", quality=80, method=6)
                  print("Prepared", source.stem)
          PY
      - name: Publish prepared covers
        run: |
          git config user.name "provkus-cover-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/uploads
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prepare responsive covers for scheduled ProVkus materials"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
