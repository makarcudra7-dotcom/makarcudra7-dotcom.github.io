name: Bump admin runtime cache
on:
  push:
    branches: [main]
    paths:
      - 'assets/admin-runtime-loader.js'
      - 'assets/admin-recipe-template.js'
      - 'assets/admin-recipe-type-normalizer.js'
      - '.github/workflows/bump-admin-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump runtime version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'admin-runtime-loader\.js\?v=[^"<]+','admin-runtime-loader.js?v=20260929-recipe-template3',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "provkus-admin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load recipe template controls in CMS"
          git pull --rebase origin main
          git push
