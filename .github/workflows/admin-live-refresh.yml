name: Wire admin live refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-live-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump admin runtime cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          s=s.replace('assets/admin-runtime-loader.js?v=20260925-schedule-fast2','assets/admin-runtime-loader.js?v=20260925-schedule-fast3')
          s=s.replace('assets/admin-discover-guard.js?v=20260925-schedule-fast2','assets/admin-discover-guard.js?v=20260925-schedule-fast3')
          p.write_text(s)
          PY
      - name: Commit cache bump
        run: |
          if git diff --quiet -- admin.html; then exit 0; fi
          git config user.name "provkus-admin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html
          git commit -m "Enable live publications refresh in CMS"
          git push origin HEAD:main
