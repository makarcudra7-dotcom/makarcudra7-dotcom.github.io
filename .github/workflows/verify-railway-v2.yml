name: Verify Railway V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-railway-v2.yml'
      - 'deploy-verify-v2.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check public Railway V2
        shell: bash
        run: |
          set -euo pipefail
          base='https://provkus-v2-production.up.railway.app'
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -L -sS -o /tmp/home -w '%{http_code}' --max-time 20 "$base/" || true)
            echo "attempt=$i home_status=$code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
          echo "home_bytes=$(wc -c </tmp/home)"
          echo "home_h1=$(grep -oP '<h1[^>]*>\K[^<]+' /tmp/home | head -1 || true)"
          echo "fruit_jazz_count=$(grep -o 'Фруктовый джаз' /tmp/home | wc -l)"
          curl -L -sS --fail --max-time 20 "$base/assets/app.js" -o /tmp/app.js
          echo "app_seasonal_count=$(grep -Eoi 'seasonal|autumn|falling-leaf|falling_leaf' /tmp/app.js | wc -l)"
          curl -L -sS --fail --max-time 20 "$base/assets/public.css" -o /tmp/public.css
          echo "public_css_bytes=$(wc -c </tmp/public.css)"
          echo "public_leaf_terms=$(grep -Eoi 'seasonal|autumn|falling-leaf|falling_leaf' /tmp/public.css | wc -l)"
          curl -L -sS --fail --max-time 20 "$base/admin.html" -o /tmp/admin.html
          echo "admin_status=200"
