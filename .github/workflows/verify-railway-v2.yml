name: Verify ProVkus Mirrors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-railway-v2.yml'
      - 'deploy-verify-v2.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check public Railway V2
        shell: bash
        run: |
          set -euo pipefail
          base='https://provkus-v2-production.up.railway.app'
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -L -sS -o /tmp/home -w '%{http_code}' --max-time 20 "$base/" || true)
            echo "attempt=$i home_status=$code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
          curl -L -sS --fail --max-time 20 "$base/assets/app.js" -o /tmp/app.js
          curl -L -sS --fail --max-time 20 "$base/assets/public.css" -o /tmp/public.css
          curl -L -sS --fail --max-time 20 "$base/admin.html" -o /tmp/admin.html

      - name: Check autonomous GitHub Pages copy
        shell: bash
        run: |
          set -euo pipefail
          base='https://makarcudra7-dotcom.github.io'
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/pages-home -w '%{http_code}' --max-time 20 "$base/" || true)
            marker=$(curl -sS --fail --max-time 20 "$base/deploy-verify-v2.txt" 2>/dev/null || true)
            echo "attempt=$i pages_status=$code marker=$marker"
            if [ "$code" = "200" ] && printf '%s' "$marker" | grep -q 'clean-css-v2'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          headers=$(mktemp)
          curl -sS --fail --max-time 20 -D "$headers" "$base/" -o /tmp/pages-home
          if grep -Eiq '^location:[[:space:]]*https?://(www\.)?provkus-media\.ru' "$headers"; then
            echo 'GitHub Pages still redirects to legacy custom domain'
            exit 1
          fi
          curl -sS --fail --max-time 20 "$base/assets/app.js" -o /tmp/pages-app.js
          curl -sS --fail --max-time 20 "$base/assets/public.css" -o /tmp/pages-public.css
          curl -sS --fail --max-time 20 "$base/admin.html" -o /tmp/pages-admin.html
          if grep -Eqi 'seasonal|autumn|falling-leaf|falling_leaf' /tmp/pages-app.js; then
            echo 'Seasonal code found in Pages app.js'
            exit 1
          fi
          if grep -Eqi 'seasonal|autumn|falling-leaf|falling_leaf' /tmp/pages-public.css; then
            echo 'Seasonal code found in Pages public.css'
            exit 1
          fi
          grep -q '<html' /tmp/pages-home
          grep -q '<html' /tmp/pages-admin.html
          echo 'GitHub Pages autonomous copy verified'
