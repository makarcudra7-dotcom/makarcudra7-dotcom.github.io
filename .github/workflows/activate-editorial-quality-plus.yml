name: Activate editorial quality plus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-editorial-quality-plus.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate runtime cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          text=p.read_text(encoding='utf-8')
          text,n=re.subn(r'assets/admin-runtime-loader\.js\?v=[^"\']+', 'assets/admin-runtime-loader.js?v=20260927-workflow-hardening4', text, count=1)
          if n!=1:
              raise SystemExit(f'admin runtime loader reference not found: {n}')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate
        run: |
          set -euo pipefail
          node --check assets/admin-runtime-loader.js
          node --check assets/admin-editorial-quality-plus.js
          grep -q "admin-editorial-quality-plus.js" assets/admin-runtime-loader.js
          grep -q "Разбор продукта" assets/admin-editorial-quality-plus.js
          grep -q "naturalWidth" assets/admin-editorial-quality-plus.js
          grep -q "20260927-workflow-hardening4" admin.html
          git diff --check
      - name: Commit activation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Activate completed editorial quality checks'
          git pull --rebase origin main
          git push
