name: Final polish v4
on:
  push:
    branches: [main]
    paths:
      - 'scripts/final_polish_v4.py'
      - '.github/workflows/final-polish-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final editorial polish
        run: python3 scripts/final_polish_v4.py
      - name: Commit polished pages
        run: |
          git config user.name "provkus-polish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json articles index.html category.html author-*.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish headlines, cards and photo credits"
          git push
